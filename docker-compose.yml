# ==============================================================================
# Paleo-Scanner Multi-Container Orchestration (Backend FastAPI + Frontend Angular)
# ==============================================================================
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: paleo-scanner-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app/infrastructure/database:/app/app/infrastructure/database
      - ./ml/models:/app/ml/models:ro
    environment:
      - PYTHONUNBUFFERED=1
      - TF_USE_LEGACY_KERAS=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - paleo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paleo-scanner-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4200/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - paleo-network

networks:
  paleo-network:
    driver: bridge
